<!DOCTYPE html>
<html>

<head>
    
<title>Game</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');


* {
    box-sizing:border-box;
}


body {

    margin:0;

    color:white;

    font-family:"Press Start 2P", monospace;


    background-image:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.7)),
    url("https://64.media.tumblr.com/ede01af5c7e26a87f3f82f5af325a803/0aac3abd211d85b8-37/s540x810/251f68e57d365c3a18dd89b94ca6c6a4df7fd527.gif");


    background-size:cover;

    background-position:center;

    background-attachment:fixed;

}


/* top bar */


.navbar {

    position:fixed;

    top:0;

    left:0;

    width:100%;


    padding:18px 25px;


    background:rgba(0,0,0,.75);


    display:flex;

    justify-content:space-between;

    align-items:center;


    z-index:10;

}



.logo {

    color:#c084fc;

    font-size:15px;

}



.nav-links {

    display:flex;

    gap:20px;

}



.nav-links a {

    color:white;

    text-decoration:none;

    font-size:11px;

}




/* page */


.wrapper {

    width:80%;

    height:80vh;


    position:absolute;

    top:52%;

    left:50%;


    transform:translate(-50%,-50%);


    display:flex;

    flex-direction:column;

    align-items:center;

}




/* game frame */


.game-frame {

    width:100%;

    height:65%;


    background:rgba(0,0,0,.5);


    border-radius:35px;


    backdrop-filter:blur(10px);


    padding:25px;

}



.game-content {


    width:100%;

    height:100%;


    background:black;


    border-radius:25px;


    overflow:hidden;

}



.game-content iframe {

    width:100%;

    height:100%;


    border:none;

    border-radius:25px;

}





/* info */


.info {

    width:100%;


    display:flex;


    justify-content:space-between;


    align-items:center;


    margin-top:25px;

}



.game-details {

    display:flex;

    align-items:center;


    gap:20px;

}



.icon {

    width:80px;

    height:80px;


    border-radius:25px;


    object-fit:cover;

}



.name {

    font-size:18px;

}




/* rating */


.rating {

    display:flex;


    flex-direction:column;


    align-items:flex-end;

}



.stars {

    white-space:nowrap;

}



.star {

    font-size:35px;


    cursor:pointer;


    color:white;


    transition:.2s;

}



.star:hover,

.star.active {

    color:#ffd700;

}



.notification {

    margin-top:15px;


    font-size:11px;


    opacity:0;


    transform:translateY(10px);


    transition:.3s;

}



.notification.show {

    opacity:1;


    transform:translateY(0);

}


</style>
<body>


<div class="navbar">


<div class="logo">
chopper👀👀👀
</div>


<div class="nav-links">


<a href="index.html">
home
</a>


<a href="games.html">
games
</a>


</div>


</div>





<div class="wrapper">



<div class="game-frame">


<div class="game-content">


<iframe id="gameFrame"></iframe>


</div>


</div>





<div class="info">



<div class="game-details">


<img class="icon" id="gameIcon" src="gameicon.png">


<div class="name" id="gameName">

game name

</div>


</div>





<div class="rating">


<div class="stars">


<span class="star">☆</span>

<span class="star">☆</span>

<span class="star">☆</span>

<span class="star">☆</span>

<span class="star">☆</span>


</div>


<div class="notification" id="notification">

</div>


</div>


</div>



</div>







<script>


/* game loader */


const params = new URLSearchParams(window.location.search);



const game = params.get("game");

const name = params.get("name");

const icon = params.get("icon");



if(game){

document.getElementById("gameFrame").src = game;

}



if(name){

document.getElementById("gameName").innerHTML = name;

}



if(icon){

document.getElementById("gameIcon").src = icon;

}





/* rating system */


const stars = document.querySelectorAll(".star");

const notification = document.getElementById("notification");



const messages = [

"",

"this sucked ahh😭😭",

"this sucked💔",

"mehh",

"idk ngl👀",

"peak👀👀👀"

];



stars.forEach((star,index)=>{


star.onclick = ()=>{


let rating = index + 1;



stars.forEach((s,i)=>{


if(i < rating){


s.innerHTML="★";


s.classList.add("active");


}

else{


s.innerHTML="☆";


s.classList.remove("active");


}


});



notification.innerHTML = messages[rating];


notification.classList.remove("show");



setTimeout(()=>{


notification.classList.add("show");


},50);



};


});


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chopperflix</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding-top:120px;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}


/* TOP BAR */

.topbar{

    height:90px;
    width:100%;

    position:fixed;
    top:0;
    left:0;

    z-index:1000;

    background:rgba(5,5,15,.75);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.15);

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:0 8px 35px rgba(0,0,0,.7);

}


.topbar h1{

    margin:0;

    font-family:"Montserrat";
    font-size:52px;

    letter-spacing:-2px;

    background:linear-gradient(
        90deg,
        #a855f7,
        #2563eb
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}


/* SEARCH */

.search{

    position:absolute;
    right:25px;

}


.search input{

    width:220px;

    padding:12px;

    border-radius:20px;

    border:none;

    background:#222;

    color:white;

}


.search button{

    margin-left:8px;

    padding:12px 15px;

    border:none;

    border-radius:20px;

    background:#7c3aed;

    color:white;

    cursor:pointer;

}


.suggestions{

    position:absolute;

    top:45px;

    width:220px;

    background:#181818;

    border-radius:10px;

    overflow:hidden;

}


.suggestion{

    padding:10px;

    cursor:pointer;

}


.suggestion:hover{

    background:#333;

}



/* CONTENT */

.section{

    padding:25px;

}


.section h2{

    font-size:32px;

}


/* SCROLL ROW */

.row{

    display:flex;

    gap:20px;

    overflow-x:auto;

    padding-bottom:15px;

}



/* CARD */

.card{

    flex:0 0 220px;

    height:330px;

    background:#181818;

    border-radius:15px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;

}


.card:hover{

    transform:scale(1.05);

}


.card img{

    width:100%;

    height:260px;

    object-fit:cover;

}


.card p{

    padding:10px;

    margin:0;

    font-weight:bold;

}


/* SEARCH PAGE */

#searchPage{

    display:none;

}


.back{

    background:#7c3aed;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:20px;

    cursor:pointer;

}


</style>

</head>


<body>


<div class="topbar">

<h1>CHOPPERFLIX</h1>


<div class="search">

<input 
id="searchBox"
placeholder="Search..."
oninput="suggest()">


<button onclick="openSearch()">
🔎
</button>


<div class="suggestions" id="suggestions"></div>


</div>

</div>





<div id="home">


<div class="section">

<h2>MOVIES</h2>

<div class="row" id="movies"></div>

</div>



<div class="section">

<h2>SHOWS</h2>

<div class="row" id="shows"></div>

</div>


</div>





<div id="searchPage">

<div class="section">

<button class="back" onclick="goBack()">
← Back
</button>


<h2>Search Results</h2>


<div class="row" id="results"></div>


</div>

</div>






<script>


const movies=[

{
title:"obssesion",
image:"https://via.placeholder.com/220x330",
banner:"banner1.png",
description:"Good movie description",
content:"https://www.vidking.net/embed/movie/1339713",
type:"movie"
},


{
title:"Placeholder Movie 2",
image:"https://via.placeholder.com/220x330",
banner:"banner2.png",
description:"Action adventure movie",
content:"https://example.com/movie2",
type:"movie"
},


{
title:"Placeholder Movie 3",
image:"https://via.placeholder.com/220x330",
banner:"banner3.png",
description:"Mystery movie",
content:"https://example.com/movie3",
type:"movie"
},


{
title:"Placeholder Movie 4",
image:"https://via.placeholder.com/220x330",
banner:"banner4.png",
description:"Epic movie",
content:"https://example.com/movie4",
type:"movie"
}

];





const shows=[

{
title:"Placeholder Show 1",
image:"https://via.placeholder.com/220x330",
banner:"showbanner.png",
description:"Funny series",
content:"https://example.com/show1",
type:"show",
seasons:2,
episodes:20
},


{
title:"Placeholder Show 2",
image:"https://via.placeholder.com/220x330",
banner:"showbanner2.png",
description:"Adventure series",
content:"https://example.com/show2",
type:"show",
seasons:3,
episodes:30
}

];





const database=[...movies,...shows];





function card(item){

return `

<div class="card" onclick="openContent('${item.content}')">

<img src="${item.image}">

<p>${item.title}</p>

</div>

`;

}




function openContent(link){

window.location.href=link;

}





movies.forEach(item=>{

document.getElementById("movies").innerHTML += card(item);

});


shows.forEach(item=>{

document.getElementById("shows").innerHTML += card(item);

});






function suggest(){

let value=document
.getElementById("searchBox")
.value
.toLowerCase();


let box=document.getElementById("suggestions");


box.innerHTML="";


if(value==="") return;



database
.filter(item=>

item.title
.toLowerCase()
.includes(value)

)
.slice(0,5)
.forEach(item=>{


box.innerHTML += `

<div class="suggestion"
onclick="choose('${item.title}')">

${item.title}

</div>

`;

});


}





function choose(name){

document.getElementById("searchBox").value=name;

document.getElementById("suggestions").innerHTML="";

}





function openSearch(){

let query=document
.getElementById("searchBox")
.value
.toLowerCase();


document.getElementById("home").style.display="none";

document.getElementById("searchPage").style.display="block";


let results=document.getElementById("results");

results.innerHTML="";



database.filter(item=>

item.title.toLowerCase().includes(query)

||
item.description.toLowerCase().includes(query)

)
.forEach(item=>{

results.innerHTML+=card(item);

});


}




function goBack(){

document.getElementById("home").style.display="block";

document.getElementById("searchPage").style.display="none";

}



</script>


</body>

</html>

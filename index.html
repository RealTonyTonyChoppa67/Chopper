}


body {

/*pass :3*/


#lock {

#site {

    justify-content:space-between;

.logo {

h1 {

    white-space:nowrap;

    border-right:5px solid white;

    animation:
    typing 3s steps(35) forwards,
    blink .7s infinite;

@keyframes typing {
